general {
    disable_loading_bar = true
    grace = 2
    hide_cursor = true
}

# A blurred live screenshot instead of a static wallpaper file.
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
    color = rgb(1e1e2e)
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_center = true
    fade_on_empty = false
    outer_color = rgb(45475a)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fail_color = rgb(f38ba8)
    check_color = rgb(a6e3a1)
    placeholder_text = Password...
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(cdd6f4)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}
